name: Fabifo taeglich aktualisieren

on:
  schedule:
    - cron: '0 5 * * *'   # 05:00 UTC ~ 6-7 Uhr deutscher Zeit (je nach Sommer-/Winterzeit)
  workflow_dispatch:        # erlaubt manuelles Starten ueber den "Run workflow"-Button

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhaengigkeiten installieren
        run: pip install feedparser yfinance

      - name: news.json aktualisieren
        run: python update_news.py

      - name: Aenderungen committen und pushen
        run: |
          git config user.name "fabifo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add news.json archive/
          git diff --quiet --cached || git commit -m "Automatisches Update: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
